# Observability stack — decoupled, runs in podman-compose on the host (make obs-up).
# Same backends as the Observability Summit demo. DriftWatch in the k3d cluster only
# pushes OTLP here via host.k3d.internal:4317. Where this lives never changes what the
# cluster enforces.
version: "3.9"
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC  (host.k3d.internal:4317)
      - "4318:4318"     # OTLP HTTP
      - "8889:8889"     # Prometheus scrape

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # Jaeger UI
      - "14317:4317"

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/agent-decisions.json:ro
    ports:
      - "3000:3000"     # Grafana UI

  neo4j:                # optional decision-graph forensics (default-off in policy)
    image: neo4j:5.20
    environment:
      - NEO4J_AUTH=neo4j/driftwatch
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ../../data/neo4j:/data
