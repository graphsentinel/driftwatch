# Demo agent workloads — STAND-INS (demo path A, the deterministic fallback).
#
# Each is a hand-authored Deployment labelled app=kagent that carries the DriftWatch
# interceptor sidecar; the workload routes its tool calls at the interceptor on
# localhost:8080, so every decision is scored before it can leave the pod.
#
# NOTE — this is NOT how real Kagent runs. Real Kagent is Helm-installed and its
# controller creates an agent pod from an `Agent` CRD; tool calls go over the network to
# separate MCP ToolServer pods. For that path (path B), DriftWatch intercepts at the MCP
# tool-call hop (point Kagent's RemoteMCPServer at the DriftWatch MCP proxy) — see
# ../README.md "Running against real Kagent / Goose (path B)". The MCP-proxy adapter is
# the next sprint; the working demo today is in-process (`make demo`).
#
# This manifest is a TOPOLOGY SCAFFOLD: it shows where the interceptor sidecar sits
# relative to an agent container. The `image:` fields are PLACEHOLDER slots — drop in
# your own workload that POSTs its tool calls to MCP_PROXY_URL.
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-orchestrator
  namespace: driftwatch
  labels:
    app: kagent                                   # demo policy selector matches this
    driftwatch.graphsentinel.org/inject: "true"   # webhook path keys off this (when enabled)
spec:
  replicas: 1
  selector:
    matchLabels: { app: kagent, agent: kagent-orchestrator }
  template:
    metadata:
      labels: { app: kagent, agent: kagent-orchestrator }
    spec:
      containers:
        - name: agent
          image: PLACEHOLDER-agent-image   # stand-in slot. Real Kagent = Helm, not this Deployment (see README path B)
          env:
            - name: MCP_PROXY_URL
              value: "http://localhost:8080/v1/tool-call"   # the workload should route tool calls here
        - name: driftwatch-interceptor
          image: ghcr.io/graphsentinel/driftwatch:0.1.0a0
          command: ["driftwatch-interceptor"]
          ports:
            - { name: intercept, containerPort: 8080 }
          env:
            - name: DRIFTWATCH_OTLP_ENDPOINT
              value: "host.k3d.internal:4317"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goose-runner
  namespace: driftwatch
  labels:
    app: kagent                                   # same governing policy
    driftwatch.graphsentinel.org/inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels: { app: kagent, agent: goose-runner }
  template:
    metadata:
      labels: { app: kagent, agent: goose-runner }
    spec:
      containers:
        - name: agent
          image: PLACEHOLDER-agent-image   # stand-in slot. Real Goose image = ghcr.io/block/goose + wiring (see README path B)
          env:
            - name: MCP_PROXY_URL
              value: "http://localhost:8080/v1/tool-call"
        - name: driftwatch-interceptor
          image: ghcr.io/graphsentinel/driftwatch:0.1.0a0
          command: ["driftwatch-interceptor"]
          ports:
            - { name: intercept, containerPort: 8080 }
          env:
            - name: DRIFTWATCH_OTLP_ENDPOINT
              value: "host.k3d.internal:4317"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
