# DriftWatch Helm values (production defaults).
image:
  repository: ghcr.io/graphsentinel/driftwatch
  tag: 0.1.0a0
  pullPolicy: IfNotPresent

# Hardened by default (NFR-9). The image is already non-root (uid 10001); these enforce
# it at the pod/container level. /data is an emptyDir mount, so readOnlyRootFilesystem
# stays compatible with the sqlite baseline store.
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

operator:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 250m, memory: 256Mi }

interceptor:
  # injected as a sidecar into governed agent pods
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

# decoupled OTLP target — overridden per environment (see values-k3d.yaml)
otel:
  endpoint: otel-collector.observability.svc.cluster.local:4317
  protocol: grpc

crd:
  install: true

rbac:
  create: true

webhook:
  # Sidecar-injector mutating webhook. Default OFF in v1alpha1: the injector binary
  # (driftwatch-injector) is roadmap; the supported path today is the manual sidecar
  # in deploy/sidecar-manual.yaml. Set true once the injector image ships.
  enabled: false
  failurePolicy: Ignore        # Ignore so a webhook outage never blocks pod creation
