{{- if .Values.webhook.enabled }}
# Sidecar-injector: a mutating admission webhook that injects the DriftWatch
# interceptor as a sidecar into pods labelled driftwatch.graphsentinel.org/inject="true".
# This is the cluster-native path; it is OFF by default in v1alpha1 because the
# `driftwatch-injector` webhook-server binary is still roadmap. The supported path today
# is the manual sidecar in deploy/sidecar-manual.yaml (same end state, no webhook).
# Rendered shape is complete so the chart is ready the moment the injector image ships.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftwatch-injector
  labels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: injector }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: injector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: injector }
    spec:
      serviceAccountName: driftwatch-operator
      containers:
        - name: injector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["driftwatch-injector"]
          ports:
            - { name: webhook, containerPort: 9443 }
          env:
            - name: DRIFTWATCH_INTERCEPTOR_PORT
              value: "{{ .Values.interceptor.port }}"
            - name: DRIFTWATCH_OTLP_ENDPOINT
              value: "{{ .Values.otel.endpoint }}"
          resources: {{- toYaml .Values.interceptor.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: driftwatch-injector
spec:
  selector: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: injector }
  ports:
    - { port: 443, targetPort: webhook }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: driftwatch-sidecar-injector
webhooks:
  - name: inject.driftwatch.graphsentinel.org
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Ignore" }}
    objectSelector:
      matchLabels:
        driftwatch.graphsentinel.org/inject: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    clientConfig:
      service:
        name: driftwatch-injector
        namespace: {{ .Release.Namespace }}
        path: /mutate
      # caBundle is injected by cert-manager or the chart's pre-install hook in prod.
{{- end }}
