apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftwatch-operator
  labels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: operator }
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: operator }
    spec:
      serviceAccountName: driftwatch-operator
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["driftwatch-operator"]
          env:
            - name: DRIFTWATCH_OTLP_ENDPOINT
              value: "{{ .Values.otel.endpoint }}"
            - name: DRIFTWATCH_DATA_DIR
              value: "/data"          # writable volume for the sqlite baseline store
          volumeMounts:
            - name: data
              mountPath: /data
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}                # baselines are rebuilt from runs; persistence is per-pod
