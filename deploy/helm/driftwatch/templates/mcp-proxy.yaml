{{- if .Values.mcpProxy.enabled }}
# E7 path-B — chain-aware MCP proxy (Deployment + Service). Real Kagent reaches it via a
# RemoteMCPServer CR (see examples/k3d-cluster-demo/manifests/remotemcpserver.yaml). It
# fronts the real MCP ToolServer(s) — one (mcpProxy.upstreamMcp) or several
# (mcpProxy.upstreams, cross-server E10) — scores each tools/call against the
# operator-reconciled baseline (mounted read-only from the shared PVC), and forwards
# survivors / denies drift with an MCP error. Needs the .[mcp] image extra (fastmcp).
{{- if and (not .Values.mcpProxy.upstreamMcp) (not .Values.mcpProxy.upstreams) }}
{{- fail "mcpProxy.enabled=true requires either mcpProxy.upstreamMcp (single URL) or mcpProxy.upstreams (list of {name,url} for cross-server)" }}
{{- end }}
{{- if not .Values.persistence.enabled }}
{{- fail "mcpProxy.enabled=true requires persistence.enabled=true (a shared PVC for the operator-written baseline the proxy reads)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftwatch-mcp
  labels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: mcp-proxy }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: mcp-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: mcp-proxy }
    spec:
      {{- with .Values.securityContext.pod }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-proxy
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["driftwatch-mcp"]
          {{- with .Values.securityContext.container }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - { name: mcp, containerPort: {{ .Values.mcpProxy.port }} }
          env:
            - { name: DRIFTWATCH_OTLP_ENDPOINT,   value: "{{ .Values.otel.endpoint }}" }
            - { name: DRIFTWATCH_DATA_DIR,        value: "/data" }     # read-only baseline mount
            {{- if .Values.mcpProxy.upstreams }}
            {{- $pairs := list }}
            {{- range .Values.mcpProxy.upstreams }}{{ $pairs = append $pairs (printf "%s=%s" .name .url) }}{{- end }}
            - { name: DRIFTWATCH_UPSTREAMS,       value: "{{ join "," $pairs }}" }   # cross-server (E10): name=url pairs
            {{- else }}
            - { name: DRIFTWATCH_UPSTREAM_MCP,    value: "{{ .Values.mcpProxy.upstreamMcp }}" }
            {{- end }}
            - { name: DRIFTWATCH_TASK_TYPE,       value: "{{ .Values.mcpProxy.taskType }}" }
            - { name: DRIFTWATCH_ACTION,          value: "{{ .Values.mcpProxy.action }}" }
            - { name: DRIFTWATCH_THRESHOLD,       value: "{{ .Values.mcpProxy.threshold }}" }
            - { name: DRIFTWATCH_FAILURE_POLICY,  value: "{{ .Values.mcpProxy.failurePolicy }}" }
            - { name: DRIFTWATCH_FEATURES,        value: "{{ .Values.mcpProxy.features }}" }
            {{- if .Values.mcpProxy.contractRef }}
            - { name: DRIFTWATCH_CONTRACT_REF,    value: "{{ .Values.mcpProxy.contractRef }}" }   # E11: declared contract (AgenticArchitecture name)
            {{- end }}
            {{- if .Values.mcpProxy.agentId }}
            - { name: DRIFTWATCH_AGENT_ID,        value: "{{ .Values.mcpProxy.agentId }}" }        # E11: which agent this seat fronts (contract key)
            {{- end }}
            {{- with .Values.mcpProxy.crossCheck }}
            {{- if .enabled }}
            - { name: DRIFTWATCH_CROSS_CHECK_ENABLED,  value: "true" }                              # E13 §4c prompt-aware cross-check
            - { name: DRIFTWATCH_CROSS_CHECK_PROVIDER, value: "{{ .provider | default "ollama" }}" }  # ollama|openai|anthropic|gemini|bedrock|runpod
            - { name: DRIFTWATCH_CROSS_CHECK_MODEL,    value: "{{ .model }}" }
            {{- if .endpoint }}
            - { name: DRIFTWATCH_CROSS_CHECK_ENDPOINT, value: "{{ .endpoint }}" }                   # base_url (openai-compatible/runpod)
            {{- end }}
            {{- if .apiKeySecretRef.name }}
            - name: {{ .apiKeySecretRef.envName | default "OPENAI_API_KEY" }}                       {{/* LLM key from a Secret */}}
              valueFrom:
                secretKeyRef:
                  name: {{ .apiKeySecretRef.name }}
                  key: {{ .apiKeySecretRef.key | default "apiKey" }}
            {{- end }}
            {{- end }}
            {{- end }}
          resources: {{- toYaml .Values.mcpProxy.resources | nindent 12 }}
          volumeMounts:
            - { name: baseline, mountPath: /data, readOnly: true }    # proxy reads; operator writes
            - { name: tmp,      mountPath: /tmp }                      # writable scratch (readOnlyRootFs)
      volumes:
        - name: baseline
          persistentVolumeClaim:
            claimName: driftwatch-baseline      # the same PVC the operator writes (persistence.enabled)
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: driftwatch-mcp
  labels: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: mcp-proxy }
spec:
  selector: { app.kubernetes.io/name: driftwatch, app.kubernetes.io/component: mcp-proxy }
  ports:
    - { name: mcp, port: {{ .Values.mcpProxy.port }}, targetPort: mcp }
{{- end }}
